<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 524" width="380" height="524" role="img" aria-labelledby="title">
<title id="title">高見舎 TAKA-MEER の電源構成図</title>
<style>
svg { --ink:#1d272e; --muted:#56616a; --line:#b3b3a6; --soft:#e3e3db; --paper:#f3f4f1; --acc:#1f5fa8; }
@media (prefers-color-scheme: dark) {
  svg { --ink:#e7eae6; --muted:#a4adb3; --line:#3d464d; --soft:#232b31; --paper:#1a2127; --acc:#6aa5ec; }
}
text { font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; fill: var(--ink); }
.bg { fill: var(--paper); }
.box { fill: var(--soft); stroke: var(--muted); stroke-width: 1; }
.box.ctrl { stroke: var(--acc); stroke-width: 1.8; }
.grp { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
.t { font-size: 11.5px; font-weight: 700; }
.s { font-size: 9.5px; fill: var(--muted); }
.gname { font-size: 12px; font-weight: 700; }
.gcode { font-size: 10px; font-weight: 400; fill: var(--muted); }
.gpow { font-size: 9px; fill: var(--muted); }
.lbl { font-size: 9px; fill: var(--muted); }
.lbl.acc { fill: var(--acc); }
.leg { font-size: 10px; fill: var(--muted); }
.x { font-size: 16px; font-weight: 700; fill: var(--acc); }
polyline { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.wire { stroke: var(--ink); stroke-width: 1.3; }
.wifi { stroke: var(--acc); stroke-width: 1.5; stroke-dasharray: 5 3; }
.mech { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 1.5 3; }
#a path { fill: var(--ink); }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.5 L8,4 L0,7.5 z"/></marker></defs>
<rect width="380" height="524" class="bg"/>
<rect x="30" y="14" width="140" height="40" rx="4" class="box"/>
<text x="100.0" y="31" class="t" text-anchor="middle">電源</text>
<text x="100.0" y="45" class="s" text-anchor="middle">機体の24V系統</text>
<rect x="210" y="14" width="140" height="40" rx="4" class="box"/>
<text x="280.0" y="31" class="t" text-anchor="middle">スイッチ</text>
<text x="280.0" y="45" class="s" text-anchor="middle">電源を入れる</text>
<rect x="115" y="78" width="150" height="40" rx="4" class="box"/>
<text x="190.0" y="95" class="t" text-anchor="middle">電源基板</text>
<text x="190.0" y="109" class="s" text-anchor="middle">系統を分ける</text>
<polyline points="100,54 100,66 170,66 170,78" class="wire" marker-end="url(#a)"/>
<polyline points="280,54 280,66 210,66 210,78" class="wire" marker-end="url(#a)"/>
<rect x="14" y="142" width="150" height="40" rx="4" class="box"/>
<text x="89.0" y="159" class="t" text-anchor="middle">DCDCコンバータ</text>
<text x="89.0" y="173" class="s" text-anchor="middle">電圧を下げる</text>
<polyline points="160,118 160,130 89,130 89,142" class="wire" marker-end="url(#a)"/>
<rect x="40" y="206" width="124" height="40" rx="4" class="box ctrl"/>
<text x="102.0" y="223" class="t" text-anchor="middle">Raspberry Pi 4</text>
<text x="102.0" y="237" class="s" text-anchor="middle">走行部</text>
<rect x="40" y="270" width="124" height="40" rx="4" class="box ctrl"/>
<text x="102.0" y="287" class="t" text-anchor="middle">ESP32</text>
<text x="102.0" y="301" class="s" text-anchor="middle">昇降部の制御</text>
<polyline points="26,182 26,226 40,226" class="wire" marker-end="url(#a)"/>
<polyline points="26,226 26,290 40,290" class="wire" marker-end="url(#a)"/>
<rect x="217" y="142" width="150" height="40" rx="4" class="box"/>
<text x="292.0" y="159" class="t" text-anchor="middle">非常停止ボタン</text>
<text x="292.0" y="173" class="s" text-anchor="middle">押すと下の電源を切る</text>
<polyline points="220,118 220,130 292,130 292,142" class="wire" marker-end="url(#a)"/>
<rect x="217" y="206" width="150" height="40" rx="4" class="box"/>
<text x="292.0" y="223" class="t" text-anchor="middle">分岐ケーブル</text>
<text x="292.0" y="237" class="s" text-anchor="middle">3台に分ける</text>
<polyline points="292,182 292,206" class="wire" marker-end="url(#a)"/>
<rect x="4" y="322" width="372" height="164" rx="8" class="grp"/>
<text x="14" y="340" class="gname" text-anchor="start">非常停止ボタンで電源が切れる</text>
<polyline points="292,246 292,352" class="wire"/>
<polyline points="64,352 292,352" class="wire"/>
<polyline points="64,352 64,364" class="wire" marker-end="url(#a)"/>
<rect x="14" y="364" width="100" height="40" rx="4" class="box"/>
<text x="64.0" y="381" class="t" text-anchor="middle">MD10C</text>
<text x="64.0" y="395" class="s" text-anchor="middle">走行・左</text>
<polyline points="64,404 64,428" class="wire" marker-end="url(#a)"/>
<rect x="14" y="428" width="100" height="40" rx="4" class="box"/>
<text x="64.0" y="445" class="t" text-anchor="middle">クローラー</text>
<text x="64.0" y="459" class="s" text-anchor="middle">左モーター</text>
<polyline points="178,352 178,364" class="wire" marker-end="url(#a)"/>
<rect x="128" y="364" width="100" height="40" rx="4" class="box"/>
<text x="178.0" y="381" class="t" text-anchor="middle">MD10C</text>
<text x="178.0" y="395" class="s" text-anchor="middle">走行・右</text>
<polyline points="178,404 178,428" class="wire" marker-end="url(#a)"/>
<rect x="128" y="428" width="100" height="40" rx="4" class="box"/>
<text x="178.0" y="445" class="t" text-anchor="middle">クローラー</text>
<text x="178.0" y="459" class="s" text-anchor="middle">右モーター</text>
<polyline points="292,352 292,364" class="wire" marker-end="url(#a)"/>
<rect x="242" y="364" width="100" height="40" rx="4" class="box"/>
<text x="292.0" y="381" class="t" text-anchor="middle">MD10C</text>
<text x="292.0" y="395" class="s" text-anchor="middle">昇降</text>
<polyline points="292,404 292,428" class="wire" marker-end="url(#a)"/>
<rect x="242" y="428" width="100" height="40" rx="4" class="box"/>
<text x="292.0" y="445" class="t" text-anchor="middle">昇降モーター</text>
<text x="292.0" y="459" class="s" text-anchor="middle">パワーウィンドウ用</text>
<text x="14" y="502" class="lbl" text-anchor="start">昇降モーターはウォームギアで位置を保つので、電源が切れても落ちない</text>
<text x="14" y="515" class="lbl" text-anchor="start">カメラ部はモバイルバッテリーで動き、非常停止では止まらない</text>
</svg>
