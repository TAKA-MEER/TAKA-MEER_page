<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 482" width="380" height="482" role="img" aria-labelledby="title">
<title id="title">走行部の速度指令の流れ</title>
<style>
svg { --ink:#1d272e; --muted:#56616a; --line:#b3b3a6; --soft:#e3e3db; --paper:#f3f4f1; --acc:#1f5fa8; }
@media (prefers-color-scheme: dark) {
  svg { --ink:#e7eae6; --muted:#a4adb3; --line:#3d464d; --soft:#232b31; --paper:#1a2127; --acc:#6aa5ec; }
}
text { font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; fill: var(--ink); }
.bg { fill: var(--paper); }
.box { fill: var(--soft); stroke: var(--muted); stroke-width: 1; }
.box.ctrl { stroke: var(--acc); stroke-width: 1.8; }
.grp { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
.t { font-size: 11.5px; font-weight: 700; }
.s { font-size: 9.5px; fill: var(--muted); }
.gname { font-size: 12px; font-weight: 700; }
.gcode { font-size: 10px; font-weight: 400; fill: var(--muted); }
.gpow { font-size: 9px; fill: var(--muted); }
.lbl { font-size: 9px; fill: var(--muted); }
.lbl.acc { fill: var(--acc); }
.leg { font-size: 10px; fill: var(--muted); }
.x { font-size: 16px; font-weight: 700; fill: var(--acc); }
polyline { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.wire { stroke: var(--ink); stroke-width: 1.3; }
.wifi { stroke: var(--acc); stroke-width: 1.5; stroke-dasharray: 5 3; }
.mech { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 1.5 3; }
#a path { fill: var(--ink); }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.5 L8,4 L0,7.5 z"/></marker></defs>
<rect width="380" height="482" class="bg"/>
<rect x="4" y="8" width="372" height="318" rx="8" class="grp"/>
<text x="366" y="26" class="gname" text-anchor="end">PC 上の ROS 2 ノード<tspan class="gcode" dx="6">th-system</tspan></text>
<rect x="14" y="38" width="100" height="40" rx="4" class="box"/>
<text x="64.0" y="55" class="t" text-anchor="middle">手動操作</text>
<text x="64.0" y="69" class="s" text-anchor="middle">画面 → jog_gate</text>
<polyline points="64,78 64,116" class="wire" marker-end="url(#a)"/>
<text x="70" y="101" class="lbl" text-anchor="start">優先 30</text>
<rect x="128" y="38" width="100" height="40" rx="4" class="box"/>
<text x="178.0" y="55" class="t" text-anchor="middle">教示再生</text>
<text x="178.0" y="69" class="s" text-anchor="middle">replay_runner</text>
<polyline points="178,78 178,116" class="wire" marker-end="url(#a)"/>
<text x="184" y="101" class="lbl" text-anchor="start">優先 20</text>
<rect x="242" y="38" width="100" height="40" rx="4" class="box"/>
<text x="292.0" y="55" class="t" text-anchor="middle">Nav2</text>
<text x="292.0" y="69" class="s" text-anchor="middle">地図上の移動</text>
<polyline points="292,78 292,116" class="wire" marker-end="url(#a)"/>
<text x="298" y="101" class="lbl" text-anchor="start">優先 10</text>
<rect x="14" y="116" width="352" height="40" rx="4" class="box ctrl"/>
<text x="190.0" y="133" class="t" text-anchor="middle">twist_mux</text>
<text x="190.0" y="147" class="s" text-anchor="middle">いちばん優先度の高い指令だけを通す</text>
<rect x="14" y="194" width="150" height="40" rx="4" class="box ctrl"/>
<text x="89.0" y="211" class="t" text-anchor="middle">safety_monitor</text>
<text x="89.0" y="225" class="s" text-anchor="middle">故障・非常停止を検知</text>
<polyline points="89,194 89,156" class="wire" marker-end="url(#a)"/>
<text x="95" y="179" class="lbl acc" text-anchor="start">全指令を止めるロック</text>
<rect x="216" y="194" width="150" height="40" rx="4" class="box ctrl"/>
<text x="291.0" y="211" class="t" text-anchor="middle">obstacle_limiter</text>
<text x="291.0" y="225" class="s" text-anchor="middle">障害物の手前で減速・停止</text>
<polyline points="291,156 291,194" class="wire" marker-end="url(#a)"/>
<rect x="216" y="272" width="150" height="40" rx="4" class="box ctrl"/>
<text x="291.0" y="289" class="t" text-anchor="middle">th_esp32_bridge</text>
<text x="291.0" y="303" class="s" text-anchor="middle">左右の車輪の速度に変換</text>
<polyline points="291,234 291,272" class="wire" marker-end="url(#a)"/>
<text x="285" y="257" class="lbl" text-anchor="end">/cmd_vel（20Hz）</text>
<rect x="14" y="350" width="150" height="40" rx="4" class="box"/>
<text x="89.0" y="367" class="t" text-anchor="middle">RPLIDAR S1</text>
<text x="89.0" y="381" class="s" text-anchor="middle">Raspberry Pi 4 経由で配信</text>
<polyline points="60,350 60,234" class="wire" marker-end="url(#a)"/>
<polyline points="164,370 190,370 190,214 216,214" class="wire" marker-end="url(#a)"/>
<rect x="216" y="350" width="150" height="40" rx="4" class="box ctrl"/>
<text x="291.0" y="367" class="t" text-anchor="middle">ESP32</text>
<text x="291.0" y="381" class="s" text-anchor="middle">ウォッチドッグ 600ms</text>
<polyline points="291,312 291,350" class="wire" marker-end="url(#a)"/>
<text x="285" y="342" class="lbl" text-anchor="end">Raspberry Pi 4 経由</text>
<rect x="216" y="428" width="150" height="40" rx="4" class="box"/>
<text x="291.0" y="445" class="t" text-anchor="middle">クローラー</text>
<text x="291.0" y="459" class="s" text-anchor="middle">左右モーター</text>
<polyline points="291,390 291,428" class="wire" marker-end="url(#a)"/>
<text x="14" y="444" class="lbl acc" text-anchor="start">駆動へ速度を送れるのは</text>
<text x="14" y="457" class="lbl acc" text-anchor="start">obstacle_limiter だけ</text>
</svg>
