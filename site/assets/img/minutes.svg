<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 490" width="380" height="490" role="img" aria-labelledby="title">
<title id="title">議事録システムの構成図</title>
<style>
svg { --ink:#1d272e; --muted:#56616a; --line:#b3b3a6; --soft:#e3e3db; --paper:#f3f4f1; --acc:#1f5fa8; }
@media (prefers-color-scheme: dark) {
  svg { --ink:#e7eae6; --muted:#a4adb3; --line:#3d464d; --soft:#232b31; --paper:#1a2127; --acc:#6aa5ec; }
}
text { font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; fill: var(--ink); }
.bg { fill: var(--paper); }
.box { fill: var(--soft); stroke: var(--muted); stroke-width: 1; }
.box.ctrl { stroke: var(--acc); stroke-width: 1.8; }
.grp { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 5 4; }
.t { font-size: 11.5px; font-weight: 700; }
.s { font-size: 9.5px; fill: var(--muted); }
.gname { font-size: 12px; font-weight: 700; }
.gcode { font-size: 10px; font-weight: 400; fill: var(--muted); }
.gpow { font-size: 9px; fill: var(--muted); }
.lbl { font-size: 9px; fill: var(--muted); }
.lbl.acc { fill: var(--acc); }
.leg { font-size: 10px; fill: var(--muted); }
.x { font-size: 16px; font-weight: 700; fill: var(--acc); }
polyline { fill: none; stroke-linejoin: round; stroke-linecap: round; }
.wire { stroke: var(--ink); stroke-width: 1.3; }
.wifi { stroke: var(--acc); stroke-width: 1.5; stroke-dasharray: 5 3; }
.mech { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 1.5 3; }
#a path { fill: var(--ink); }
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0.5 L8,4 L0,7.5 z"/></marker></defs>
<rect width="380" height="490" class="bg"/>
<rect x="216" y="14" width="150" height="40" rx="4" class="box"/>
<text x="291.0" y="31" class="t" text-anchor="middle">ワイヤレスイヤホン</text>
<text x="291.0" y="45" class="s" text-anchor="middle">自社側の人が付ける</text>
<rect x="4" y="74" width="372" height="330" rx="8" class="grp"/>
<text x="366" y="92" class="gname" text-anchor="end">試験場の PC<tspan class="gcode" dx="6">Windows・Docker</tspan></text>
<rect x="14" y="104" width="150" height="40" rx="4" class="box"/>
<text x="89.0" y="121" class="t" text-anchor="middle">ブラウザ 1</text>
<text x="89.0" y="135" class="s" text-anchor="middle">内蔵マイクで録音</text>
<rect x="216" y="104" width="150" height="40" rx="4" class="box"/>
<text x="291.0" y="121" class="t" text-anchor="middle">ブラウザ 2</text>
<text x="291.0" y="135" class="s" text-anchor="middle">イヤホンで録音（話者判定）</text>
<polyline points="291,54 291,104" class="wire" marker-end="url(#a)"/>
<rect x="14" y="190" width="352" height="40" rx="4" class="box ctrl"/>
<text x="190.0" y="207" class="t" text-anchor="middle">minutes-app</text>
<text x="190.0" y="221" class="s" text-anchor="middle">FastAPI・faster-whisper large-v3・議事録の組み立て</text>
<polyline points="89,144 89,190" class="wire" marker-start="url(#a)" marker-end="url(#a)"/>
<polyline points="291,144 291,190" class="wire" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="95" y="170" class="lbl" text-anchor="start">音声／文字起こし</text>
<text x="297" y="170" class="lbl" text-anchor="start">WebSocket</text>
<rect x="14" y="276" width="170" height="40" rx="4" class="box ctrl"/>
<text x="99.0" y="293" class="t" text-anchor="middle">minutes-ollama</text>
<text x="99.0" y="307" class="s" text-anchor="middle">Ollama・qwen3.5:9b</text>
<polyline points="99,230 99,276" class="wire" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="105" y="256" class="lbl" text-anchor="start">議事録を生成</text>
<rect x="216" y="276" width="150" height="40" rx="4" class="box"/>
<text x="291.0" y="293" class="t" text-anchor="middle">議事録</text>
<text x="291.0" y="307" class="s" text-anchor="middle">Word（docx）・PDF に変換可</text>
<polyline points="291,230 291,276" class="wire" marker-end="url(#a)"/>
<rect x="14" y="350" width="170" height="40" rx="4" class="box"/>
<text x="99.0" y="367" class="t" text-anchor="middle">GPU</text>
<text x="99.0" y="381" class="s" text-anchor="middle">VRAM 8GB・交互に使う</text>
<polyline points="99,316 99,350" class="mech"/>
<polyline points="200,230 200,370 184,370" class="mech"/>
<polyline points="291,404 291,436" class="mech"/>
<text x="291" y="426" class="x" text-anchor="middle">×</text>
<rect x="216" y="436" width="150" height="40" rx="4" class="box"/>
<text x="291.0" y="453" class="t" text-anchor="middle">インターネット</text>
<text x="291.0" y="467" class="s" text-anchor="middle">会話の内容は送らない</text>
<text x="14" y="452" class="lbl acc" text-anchor="start">録音・文字起こし・要約は</text>
<text x="14" y="465" class="lbl acc" text-anchor="start">すべてこの PC の中で処理する</text>
</svg>
